[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoyager-intelligence"
version = "0.1.0"
description = "SQLAlchemy-native evidence, findings, and intelligence models for NetVoyager"
requires-python = ">=3.11"
dependencies = ["netvoyager-core>=0.1.0", "SQLAlchemy>=2.0,<2.1"]

[tool.setuptools.packages.find]
where = ["src"]
