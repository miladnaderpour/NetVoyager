[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoyager-import"
version = "0.1.0"
description = "NetVoyager import package scaffold"
requires-python = ">=3.11"
dependencies = [
    "netvoyager-network>=0.1,<0.2",
    "openpyxl>=3.1,<4",
]

[tool.uv.sources]
netvoyager-network = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
