[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoyager-paloalto"
version = "0.1.0"
description = "Palo Alto integrations for NetVoyager"
requires-python = ">=3.11"
dependencies = [
    "netvoyager-core>=0.1,<0.2",
]

[tool.setuptools.packages.find]
where = ["src"]