[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoyager-analysis"
version = "0.1.0"
description = "NetVoyager analysis processing (fresh unified-ORM implementation)"
requires-python = ">=3.11"
dependencies = [
    "netvoyager-core>=0.1.0",
    "netvoyager-database>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
