
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoyager-database"
version = "0.1.0"
description = "SQL persistence infrastructure for NetVoyager"
requires-python = ">=3.11"
dependencies = [
    "netvoyager-core>=0.1.0",
    "netvoyager-network>=0.1.0",
    "netvoyager-intelligence>=0.1.0",
    "SQLAlchemy>=2.0,<2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
