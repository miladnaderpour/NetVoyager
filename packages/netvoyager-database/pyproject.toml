[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoyager-database"
version = "0.1.0"
description = "Isolated unified inventory domain/database experiment"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netvoyager_database.migrations" = ["script.py.mako", "versions/*.py"]
