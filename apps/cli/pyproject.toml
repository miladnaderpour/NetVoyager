[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoyager-cli"
version = "0.1.0"
description = "NetVoyager API command-line client"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
netvoyager = "netvoyager_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
