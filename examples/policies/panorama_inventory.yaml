
source_id: paloalto_panorama
method: managed_device_inventory
description: Panorama managed physical firewall inventory
version: 2
fully_trusted: false

claims:
  - claim: device.physical_identity
    authority: trusted
    actions:
      record_observation: {}
      create_candidate: {}
      correlate_candidate: {}
      promote_candidate:
        requirements:
          - unique_physical_serial
          - unambiguous_device_match
      create_canonical_device:
        requirements:
          - unique_physical_serial
          - unambiguous_device_match

  - claim: device.serial_number
    authority: trusted
    actions:
      record_observation: {}
      confirm_attribute:
        requirements:
          - verified_device_identity

  - claim: device.model
    authority: trusted
    actions:
      record_observation: {}
      confirm_attribute:
        requirements:
          - verified_device_identity

  - claim: device.software_version
    authority: trusted
    actions:
      record_observation: {}
      confirm_attribute:
        requirements:
          - verified_device_identity

  - claim: device.host_name
    authority: trusted
    actions:
      record_observation: {}
      confirm_attribute:
        requirements:
          - verified_device_identity

  - claim: device.management_ip
    authority: trusted
    actions:
      record_observation: {}
      confirm_attribute:
        requirements:
          - verified_device_identity
          - verified_management_address

  - claim: prefix.existence
    authority: trusted
    actions:
      record_observation: {}
      create_candidate: {}
      correlate_candidate: {}
      create_canonical_prefix:
        requirements:
          - valid_network_prefix
          - verified_reporting_source
      promote_candidate:
        requirements:
          - valid_network_prefix
          - verified_reporting_source

  - claim: relationship.device_site
    authority: supporting
    actions:
      record_observation: {}
      create_candidate_relationship: {}
